# No cert-manager annotation here on purpose: the Certificate resource in
# 10-certificate.yaml already owns the wisecow-tls Secret. Adding a second
# annotation would make the ingress-shim race the Certificate for that Secret.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wisecow
  namespace: wisecow
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - wisecow.local
    secretName: wisecow-tls
  rules:
  - host: wisecow.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wisecow
            port:
              number: 443
