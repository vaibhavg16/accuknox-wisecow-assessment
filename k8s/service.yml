apiVersion: v1
kind: Service
metadata:
  name: wisecow
  namespace: wisecow
  labels:
    app.kubernetes.io/name: wisecow
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 4499
    protocol: TCP
    name: http
  - port: 443
    targetPort: 8443
    protocol: TCP
    name: https
  selector:
    app.kubernetes.io/name: wisecow
---
apiVersion: v1
kind: Service
metadata:
  name: wisecow-headless
  namespace: wisecow
spec:
  clusterIP: None
  ports:
  - port: 4499
    targetPort: 4499
    name: http
  selector:
    app.kubernetes.io/name: wisecow
