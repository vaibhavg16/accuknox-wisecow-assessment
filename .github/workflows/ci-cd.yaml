name: CI/CD - Wisecow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: vaibhav161202/wisecow

jobs:
  # Gate runs FIRST. Nothing is published until the source is known-good.
  # An earlier version of this workflow validated at the end of the build job
  # and published :latest before the check ran - so a truncated wisecow.sh
  # reached Docker Hub even though the guard eventually failed.
  validate:
    name: Validate source and manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check wisecow.sh is complete
      run: |
        if [ "$(tail -1 wisecow.sh | tr -d '[:space:]')" != "main" ]; then
          echo "::error file=wisecow.sh::script is truncated - final line must be 'main'"
          echo "--- last 5 lines ---"
          tail -5 wisecow.sh
          exit 1
        fi
        bash -n wisecow.sh
        echo "wisecow.sh: syntax OK, entrypoint present"

    - name: Render Kubernetes manifests
      run: |
        kubectl kustomize k8s/ > rendered.yaml
        echo "Rendered $(grep -c '^kind:' rendered.yaml) resources"
        grep '^kind:' rendered.yaml | sort | uniq -c

    - name: Validate manifest schemas
      run: |
        curl -sSLo kubeconform.tar.gz \
          https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
        tar xzf kubeconform.tar.gz kubeconform
        ./kubeconform -strict -summary -ignore-missing-schemas rendered.yaml

    - name: Check no certificate material is committed
      run: |
        if git ls-files | grep -Eq '\.(key|pem|crt)$'; then
          echo "::error::private key or certificate committed - see .gitignore"
          git ls-files | grep -E '\.(key|pem|crt)$'
          exit 1
        fi
        echo "no certificate material tracked"

  build:
    name: Build, scan and publish
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

    # Pull requests build but do not publish.
    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix=
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Smoke-test the image we just built before trusting the tag.
    - name: Verify the built image runs
      run: |
        docker run -d --name smoke -p 14500:4499 \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        for i in $(seq 1 20); do
          if curl -fsS http://localhost:14500/ -o /tmp/out; then
            grep -q '<pre>' /tmp/out && echo "image serves cowsay output" && exit 0
          fi
          sleep 2
        done
        echo "::error::image did not serve a response within 40s"
        docker logs smoke
        exit 1

# Deployment is intentionally not part of this workflow.
#
# The assessment asks for an Action that builds a new image when changes are
# pushed, which the build job satisfies. A deploy stage cannot work from a
# GitHub-hosted runner against a kind cluster on a laptop: the runner has no
# route to it. Deployment requires a cloud cluster (GKE/EKS) with a stored
# KUBECONFIG secret, or a self-hosted runner bound to a reachable cluster.
# Cluster deployment was verified locally - see docs/SUBMISSION_REPORT.md.
