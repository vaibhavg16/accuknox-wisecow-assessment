name: CI/CD - Wisecow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: vaibhav161202/wisecow

jobs:
  build:
    name: Build, scan and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix=
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

    # Render the kustomization purely client-side. `kubectl apply -k
    # --dry-run=client` is NOT offline: it still performs API discovery to
    # resolve resource types and fails with "connection refused" on a runner
    # with no cluster. `kubectl kustomize` touches no API server.
    - name: Render Kubernetes manifests
      run: |
        kubectl kustomize k8s/ > rendered.yaml
        echo "Rendered $(grep -c '^kind:' rendered.yaml) resources"
        grep '^kind:' rendered.yaml | sort | uniq -c

    # Offline schema validation against the upstream Kubernetes OpenAPI specs.
    # -ignore-missing-schemas skips the cert-manager CRDs, which aren't in the
    # upstream schema bundle.
    - name: Validate manifest schemas
      run: |
        curl -sSLo kubeconform.tar.gz \
          https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
        tar xzf kubeconform.tar.gz kubeconform
        ./kubeconform -strict -summary -ignore-missing-schemas rendered.yaml

    - name: Verify wisecow.sh is intact
      run: |
        # Cheap regression guard: the script was once committed truncated,
        # which produced a CrashLooping image. Fail fast if that recurs.
        test "$(tail -1 wisecow.sh)" = "main" \
          || { echo "::error::wisecow.sh is truncated - final line should be 'main'"; exit 1; }
        bash -n wisecow.sh
        echo "wisecow.sh syntax OK"

# Deployment is intentionally not part of this workflow.
#
# The assessment requirement is an Action that builds a new image when changes
# are pushed - which the build job satisfies. A deploy stage cannot work from a
# GitHub-hosted runner against a kind cluster on a laptop: the runner has no
# route to it. Wiring up deployment requires either a cloud cluster (GKE/EKS)
# with a stored KUBECONFIG secret, or a self-hosted runner bound to a reachable
# cluster. Cluster deployment was verified locally instead - see
# docs/SUBMISSION_REPORT.md.

