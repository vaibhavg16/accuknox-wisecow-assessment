name: CI/CD - Wisecow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: vaibhav161202/wisecow

jobs:
  # Gate runs FIRST. Nothing is published until the source is known-good.
  # An earlier version of this workflow validated at the end of the build job
  # and published :latest before the check ran - so a truncated wisecow.sh
  # reached Docker Hub even though the guard eventually failed.
  validate:
    name: Validate source and manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check wisecow.sh is complete
      run: |
        if [ "$(tail -1 wisecow.sh | tr -d '[:space:]')" != "main" ]; then
          echo "::error file=wisecow.sh::script is truncated - final line must be 'main'"
          echo "--- last 5 lines ---"
          tail -5 wisecow.sh
          exit 1
        fi
        bash -n wisecow.sh
        echo "wisecow.sh: syntax OK, entrypoint present"

    - name: Render Kubernetes manifests
      run: |
        kubectl kustomize k8s/ > rendered.yaml
        echo "Rendered $(grep -c '^kind:' rendered.yaml) resources"
        grep '^kind:' rendered.yaml | sort | uniq -c

    - name: Validate manifest schemas
      run: |
        curl -sSLo kubeconform.tar.gz \
          https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
        tar xzf kubeconform.tar.gz kubeconform
        ./kubeconform -strict -summary -ignore-missing-schemas rendered.yaml

    - name: Check no certificate material is committed
      run: |
        if git ls-files | grep -Eq '\.(key|pem|crt)$'; then
          echo "::error::private key or certificate committed - see .gitignore"
          git ls-files | grep -E '\.(key|pem|crt)$'
          exit 1
        fi
        echo "no certificate material tracked"

  build:
    name: Build, scan and publish
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

    # Pull requests build but do not publish.
    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix=
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Smoke-test the published image before the pipeline is considered green.
    #
    # Use the tags metadata-action actually produced, not ${{ github.sha }}:
    # `type=sha,prefix=` emits a 7-character tag, so referencing the full
    # 40-character SHA asks Docker for an image that was never built.
    # Every computed tag points at the same digest, so any of them will do.
    - name: Verify the published image runs
      if: github.event_name != 'pull_request'
      run: |
        IMAGE_TAG="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
        echo "testing $IMAGE_TAG"
        docker run -d --name smoke -p 14500:4499 "$IMAGE_TAG"

        for i in $(seq 1 20); do
          if curl -fsS http://localhost:14500/ -o /tmp/out; then
            if grep -q '</pre>' /tmp/out; then
              echo "image serves a complete cowsay response"
              exit 0
            fi
          fi
          sleep 2
        done

        echo "::error::image did not serve a complete response within 40s"
        docker logs smoke || true
        exit 1

    - name: Stop smoke container
      if: always() && github.event_name != 'pull_request'
      run: docker rm -f smoke || true

  # Deployment runs on a self-hosted runner registered on the machine that
  # hosts the kind cluster. A GitHub-hosted runner has no route to a local
  # cluster, which is why this job is pinned to `self-hosted` rather than
  # ubuntu-latest. If no runner is online the job queues instead of failing.
  deploy:
    name: Deploy to Kubernetes
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # The runner may execute as a different user than the one that ran
    # config.sh (svc.sh installs a systemd unit), so ~/.kube/config is not
    # guaranteed to exist. Supplying KUBECONFIG_DATA makes the job independent
    # of runner-user state.
    - name: Set up kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: Confirm cluster is reachable
      run: |
        kubectl config current-context
        kubectl get nodes

    - name: Pin the deployment to this commit's image
      run: |
        IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        # metadata-action emits a 7-character sha tag
        SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
        IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}"
        echo "deploying $IMAGE"
        sed -i "s|image: docker.io/.*/wisecow:.*|image: ${IMAGE}|" k8s/deployment.yaml
        grep 'image:' k8s/deployment.yaml

    - name: Apply manifests
      run: |
        kubectl apply -k k8s/
        kubectl -n wisecow rollout status deployment/wisecow --timeout=180s

    # curl, not wget: the runtime image is debian-slim and ships curl (it is
    # needed by the HEALTHCHECK) but no wget. Using wget here fails with
    # "wget: not found" inside an otherwise healthy container.
    - name: Smoke test through the pod
      run: |
        POD=$(kubectl -n wisecow get pod -l app.kubernetes.io/name=wisecow \
          -o jsonpath='{.items[0].metadata.name}')
        echo "testing pod: $POD"
        kubectl -n wisecow exec "$POD" -c wisecow -- \
          sh -c 'curl -fsS --max-time 5 http://127.0.0.1:4499/ | grep -q "</pre>"'
        echo "app container serves a complete response"

    - name: Smoke test through the TLS sidecar
      run: |
        POD=$(kubectl -n wisecow get pod -l app.kubernetes.io/name=wisecow \
          -o jsonpath='{.items[0].metadata.name}')
        kubectl -n wisecow exec "$POD" -c tls-sidecar -- \
          sh -c 'wget -q --no-check-certificate -O- https://127.0.0.1:8443/ | grep -q "</pre>"'
        echo "TLS sidecar serves a complete response over HTTPS"

    - name: Report pod state
      if: always()
      run: |
        kubectl -n wisecow get pods
        kubectl -n wisecow get hpa

# Deployment notes.
#
# The assessment asks for a build-and-push pipeline (satisfied by the build
# job) and, as a challenge goal, automatic deployment to Kubernetes. The deploy
# job above fulfils that goal using a self-hosted runner on the machine hosting
# the cluster. A GitHub-hosted runner cannot route to a local kind cluster, so
# `runs-on: self-hosted` is required rather than preferred.
#
# To disable CD, delete the deploy job - nothing else depends on it.

